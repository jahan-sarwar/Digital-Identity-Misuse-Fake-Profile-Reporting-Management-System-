<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}User Registration & Authentication{% endblock %} | SE331</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="{% url 'profile' %}">
                <i class="fa-solid fa-user-shield me-2"></i>User Authentication System
            </a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}

                <span class="nav-item nav-link text-white-50 me-2"><i class="fa-solid fa-user me-1"></i>{{ user.username
                    }}</span>
                <a class="nav-link text-white" href="{% url 'profile' %}">My Profile</a>
                <a class="btn btn-outline-danger btn-sm ms-2" href="{% url 'logout' %}">Sign Out</a>
                {% else %}
                <a class="nav-link text-white me-2" href="{% url 'login' %}">Sign In</a>
                <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container my-4 flex-grow-1">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-white border-top py-3 text-center text-muted small">
        User Registration & Account Management
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
