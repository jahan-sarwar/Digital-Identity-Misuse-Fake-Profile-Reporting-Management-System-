<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Supporting Evidence Upload & Validation{% endblock %} </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="{% url 'evidence_gallery' %}">
                <i class="fa-solid fa-file-shield me-2 text-warning"></i>Evidence Attachment System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="{% url 'evidence_gallery' %}"><i class="fa-solid fa-images me-1"></i> Gallery</a>
                <a class="btn btn-warning btn-sm fw-semibold ms-2" href="{% url 'upload_evidence' %}">
                    <i class="fa-solid fa-upload me-1"></i> Upload Evidence
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-4 flex-grow-1">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-white border-top py-3 text-center text-muted small">
        Supporting Evidence File Upload & Security Validation
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
