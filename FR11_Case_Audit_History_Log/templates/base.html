<!DOCTYPE html>
<!-- Base layout for Security Audit Trail & History Log -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Case Audit Trail{% endblock %} - Forensic Logs</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <!-- Top Bar Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-primary" href="{% url 'audit_dashboard' %}">
                <i class="fa-solid fa-fingerprint text-info me-2"></i>Security Audit Trail & Case History Log
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="badge bg-secondary me-3">
                    <i class="fa-solid fa-lock me-1"></i> Immutable SHA-256 Digest
                </span>
                <a href="{% url 'audit_dashboard' %}?export=csv" class="btn btn-sm btn-outline-light">
                    <i class="fa-solid fa-file-csv me-1"></i> Export Audit CSV
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container-fluid px-4 my-3 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-2 mt-auto text-center text-muted small">
        <div class="container-fluid">
            &copy; 2026 Digital Identity Misuse & Fake Profile Reporting Management System. Forensic Security Audit Division.
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
